# nginx-Block fuer das Kassasystem.
#
# Auf diesem Server laeuft nginx bereits fuer andere Seiten und belegt Port
# 80/443. Der Kassa-Container haengt deshalb nur auf 127.0.0.1:8080, und
# nginx nimmt HTTPS entgegen und leitet weiter.
#
# Einrichten (als root):
#   1. Datei nach /etc/nginx/sites-available/kassa kopieren
#   2. Domain unten anpassen, falls sie nicht kassa.viennax.at heisst
#   3. ln -s /etc/nginx/sites-available/kassa /etc/nginx/sites-enabled/kassa
#   4. nginx -t && systemctl reload nginx
#   5. certbot --nginx -d kassa.viennax.at
#      certbot ergaenzt den HTTPS-Block selbst und erneuert kuenftig automatisch.
#
# Danach pruefen:  curl https://kassa.viennax.at/config

# WebSockets: nginx reicht Upgrade-Anfragen NICHT von selbst durch. Ohne diese
# Zuordnung wuerde das Kassieren zwar funktionieren, aber die Live-Aktualisierung
# zwischen den Geraeten still ausfallen — der unangenehmste Fehlerfall, weil
# nichts sichtbar kaputt ist.
#
# Der Name traegt bewusst ein Praefix: heisst die Variable anderswo auf diesem
# Server schon $connection_upgrade, gaebe es sonst einen Namenskonflikt.
map $http_upgrade $kassa_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;

    server_name kassa.viennax.at;

    # Zugriffe getrennt protokollieren, damit sie nicht in den Logs der
    # anderen Seiten untergehen.
    access_log /var/log/nginx/kassa.access.log;
    error_log  /var/log/nginx/kassa.error.log;

    # Die App laedt nur JSON, keine Uploads — eine kleine Grenze reicht und
    # begrenzt den Schaden bei Unsinn von aussen.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        # HTTP/1.1 ist Voraussetzung fuer das Upgrade auf WebSocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $kassa_connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Der WebSocket ist im Betrieb lange still (er meldet sich nur, wenn
        # jemand bucht). Mit dem Standardwert von 60 Sekunden wuerde nginx ihn
        # staendig abraeumen und die Geraete muessten dauernd neu verbinden.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Antworten des Servers unveraendert durchreichen.
        proxy_buffering off;
    }
}
