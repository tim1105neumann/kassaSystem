# Kassasystem Heuriger — Deployment.
#
#   Starten:  cd deploy && docker compose up -d
#   Status:   docker compose ps
#   Logs:     docker compose logs -f
#
# Ein Container: der Vapor-Server. Er lauscht NUR auf 127.0.0.1 und ist damit
# aus dem Internet nicht direkt erreichbar. Davor haengt das nginx, das auf
# diesem Server ohnehin schon laeuft: es beendet HTTPS und leitet weiter.
# Der passende nginx-Block liegt in nginx-kassa.conf.
#
# Alle Einstellungen stehen in der Datei .env (Vorlage: .env.example).

name: kassa

services:
  kassa:
    # Build-Kontext ist das Projekt-Hauptverzeichnis (eine Ebene ueber deploy/),
    # weil der Server das Swift-Paket aus Shared/ mitkompiliert und daher
    # beide Ordner sehen muss.
    build:
      context: ..
      dockerfile: Server/Dockerfile

    restart: unless-stopped

    environment:
      # Pflicht. Ohne Eintrag in .env startet nichts — das ist Absicht.
      KASSA_PASSWORD: ${KASSA_PASSWORD:?KASSA_PASSWORD fehlt. Bitte .env anlegen (Vorlage .env.example).}
      TABLE_COUNT: ${TABLE_COUNT:-40}
      BUSINESS_DAY_CUTOFF_HOUR: ${BUSINESS_DAY_CUTOFF_HOUR:-6}

      # Fest verdrahtet, weil an das Volume bzw. den Proxy gekoppelt.
      DATABASE_PATH: /data/kassa.sqlite
      PORT: 8080

      # Wichtig fuer den Tageswechsel um 06:00: ohne Zeitzone rechnet der
      # Server in UTC und der Betriebstag verschiebt sich um 1-2 Stunden.
      TZ: Europe/Vienna

    volumes:
      # Hier liegt die Datenbank. Ueberlebt Updates und Neustarts.
      - data:/data

    # Die fuehrende 127.0.0.1 ist sicherheitsrelevant: ohne sie waere der
    # Server ungeschuetzt aus dem Internet erreichbar, am nginx vorbei.
    ports:
      - "127.0.0.1:${KASSA_HOST_PORT:-8080}:8080"

    # Prueft, ob der Server ueberhaupt HTTP beantwortet. Auch eine
    # 401-Antwort zaehlt als "lebt" — /config kann Login verlangen.
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/config | grep -q '^[234]'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

    # Ohne Begrenzung waechst das Log bis die VPS-Platte voll ist.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:          # SQLite-Datenbank des Kassaservers
